tools_definitions:
  - name: fiware-mcp-local
    type: mcp_streamable_http
    config:
      name: "fiware-mcp"
      launcher: "fiware-mcp-server"
      host: "127.0.0.1"
      port: 5001
      context_url: "context-data-loader"
      auto_start: true
      startup_timeout_seconds: 15
      allowed_tools:
        - execute_query
        - get_all_entities
        - get_entity_types
        - CB_version
        - haversine_dist
      cache_tools_list: true

  - name: code-interpreter
    type: openai-responses-tool
    config:
      type: code_interpreter
      container:
        type: auto
        memory_limit: 4g
