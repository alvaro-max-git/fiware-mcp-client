services:
  api:
    build:
      context: .
    image: fiware-mcp-client:local
    command: python -m uvicorn app.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?Set OPENAI_API_KEY in .env or your shell before running docker compose up}
      FIWARE_CLIENT_CONFIG: /app/config.docker.yaml
      FIWARE_CB_BASE_URL: ${FIWARE_CB_BASE_URL:-http://host.docker.internal:1026}
      FIWARE_CB_BASE_URL_CONTEXT_DATA_LOADER: ${FIWARE_CB_BASE_URL_CONTEXT_DATA_LOADER:-}
      FIWARE_CB_BASE_URL_MCP_EXPERIMENTS: ${FIWARE_CB_BASE_URL_MCP_EXPERIMENTS:-}
      LOGS_DIR: /app/logs
      PROMPTS_DIR: /app/prompts
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - fiware-data:/app/data
      - fiware-logs:/app/logs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  ui:
    build:
      context: .
    image: fiware-mcp-client:local
    command: python -m app.ui.gradio_app --api-base http://api:8000/api/v1 --host 0.0.0.0 --port 7860
    ports:
      - "7860:7860"
    environment:
      FIWARE_API_BASE: http://api:8000/api/v1
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7860/', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  fiware-data:
  fiware-logs:
